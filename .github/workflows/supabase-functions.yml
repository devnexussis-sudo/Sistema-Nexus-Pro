name: Deploy Supabase Edge Functions

on:
  push:
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Permite rodar o deploy manualmente pelo painel do GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: esrwwaoirlhcptbxtlsu

    steps:
      - name: 📦 Obter código fonte
        uses: actions/checkout@v3

      - name: 🔧 Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Deploy da Edge Function (r2-operations)
        run: supabase functions deploy r2-operations --project-ref $PROJECT_ID

      - name: 🚀 Deploy Edge Functions (WhatsApp Bot)
        run: |
          supabase functions deploy whatsapp-bot --project-ref $PROJECT_ID
          supabase functions deploy whatsapp-ai-agent --project-ref $PROJECT_ID
          supabase functions deploy whatsapp-admin-send --project-ref $PROJECT_ID
          supabase functions deploy os-status-notify --project-ref $PROJECT_ID
